[project]
name = "umny-remont-backend"
version = "0.1.0"
description = "Backend платформы «Умный ремонт»"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy[asyncio]==2.0.41",
  "asyncpg==0.30.0",
  "alembic==1.16.1",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "pyjwt==2.10.1",
  "redis==6.2.0",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==1.0.0",
  "pytest-cov==6.1.1",
  "httpx==0.28.1",
  "fakeredis==2.29.0",
  "ruff==0.11.12",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fakeredis.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
