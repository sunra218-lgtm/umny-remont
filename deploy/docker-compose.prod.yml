# Сервер пилота: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Подробно — deploy/README.md. Наружу открыты только порты 80 и 443 (Caddy, HTTPS сам от Let's Encrypt).

name: umny

x-backend-env: &backend-env
  ENV: prod
  DATABASE_URL: postgresql+asyncpg://umny:${POSTGRES_PASSWORD}@db:5432/umny
  REDIS_URL: redis://redis:6379/0
  PUBLIC_BASE_URL: https://${DOMAIN}
  COOKIE_SECURE: "true"
  OTP_DEBUG: "false"
  JWT_SECRET: ${JWT_SECRET}
  BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET}
  BOOTSTRAP_ADMIN_PHONES: ${BOOTSTRAP_ADMIN_PHONES}
  PLATFORM_INN: ${PLATFORM_INN}
  PLATFORM_LEGAL_NAME: ${PLATFORM_LEGAL_NAME}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  STORAGE_LOCAL_DIR: /data/media
  S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
  S3_BUCKET: ${S3_BUCKET:-umny-media}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
  RATE_LIMIT_WRITES_PER_MINUTE: ${RATE_LIMIT_WRITES_PER_MINUTE:-60}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: umny
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umny -d umny"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
      args:
        EXTRAS: ""
    image: umny-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Два процесса uvicorn; X-Forwarded-For принимается только от Caddy и сайта (сеть ниже).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: 172.29.0.0/16
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 30

  worker:
    image: umny-backend
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.jobs", "worker"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # Резервная копия базы каждую ночь в 03:00 МСК, хранится 14 дней (том backups).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "echo '0 3 * * * sh /backup.sh' | crontab - && crond -f -l 8"]
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  pgdata:
  redisdata:
  media:
  backups:
  caddy_data:
  caddy_config:
